name: Research question to program planner receiving

on:
  push:
    paths:
      - "apps/research-program-workbench/**"
      - ".github/workflows/research-program-question-receiving.yml"
  pull_request:
    paths:
      - "apps/research-program-workbench/**"
      - ".github/workflows/research-program-question-receiving.yml"

permissions:
  contents: read

jobs:
  native-source-receiving:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the original research workbench
        uses: actions/checkout@v4
      - name: Check out pinned original first-class question producer
        uses: actions/checkout@v4
        with:
          repository: red-cup-engineering/record-research-question-service
          ref: 23b4fcd56cdf9aa7636759a382c27edfeadc61bd
          path: question-producer
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install original workspace packages
        run: |
          python -m pip install \
            -e apps/research-program-workbench/research-corpus \
            -e apps/research-program-workbench/program-planner
      - name: Execute original-producer to planner integration and refusal cases
        env:
          RESEARCH_QUESTION_PRODUCER: ${{ github.workspace }}/question-producer/scripts/record-research-question-cli.mjs
        run: |
          python -m unittest discover \
            -s apps/research-program-workbench/program-planner/tests \
            -v

  living-science-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the original research workbench
        uses: actions/checkout@v4
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the living-science packages
        run: |
          python -m pip install \
            apps/research-program-workbench/research-corpus \
            apps/research-program-workbench/research-citations \
            apps/research-program-workbench/program-validator \
            apps/research-program-workbench/research-dagger \
            apps/research-program-workbench/monograph-composer
      - name: Ensure the native citation renderer is available
        shell: bash
        run: |
          if ! command -v pandoc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends pandoc
          fi
          pandoc --version
      - name: Verify the living-science receiving specification
        run: |
          python -m unittest discover -s apps/research-program-workbench/tests -p test_living_science_contracts.py -v

  authored-vocabulary-receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the existing vocabulary producer
        run: python -m pip install apps/research-program-workbench/research-corpus
      - name: Check authored field, destination and audience receiving
        run: |
          python -m unittest discover -s apps/research-program-workbench/tests -p test_authored_vocabulary_relations.py -v
