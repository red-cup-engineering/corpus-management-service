name: Research question to program planner receiving

on:
  push:
    paths:
      - "apps/research-program-workbench/**"
      - ".github/workflows/research-program-question-receiving.yml"
  pull_request:
    paths:
      - "apps/research-program-workbench/**"
      - ".github/workflows/research-program-question-receiving.yml"

permissions:
  contents: read

jobs:
  native-source-receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out the original research workbench
        uses: actions/checkout@v4
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Receive the original pinned question recorder from the canonical registry
        shell: bash
        env:
          QUESTION_COORDINATE: '@red-cup-engineering/record-research-question-service@0.1.1-dev.3'
          QUESTION_GIT_HEAD: 23b4fcd56cdf9aa7636759a382c27edfeadc61bd
          QUESTION_INTEGRITY: sha512-BLbGOlA9wy3wLoU+Bo8Yw8Zwurij9xKWfOyYTvyxb9qu8UvLDPiYoIIVESA1e7pSS0hYpyxGbHcev5sg1v1X6g==
        run: |
          set -euo pipefail
          package_root="$(mktemp -d "${RUNNER_TEMP}/question-recorder.XXXXXX")"
          registry=https://registry.561.group/
          npm view "${QUESTION_COORDINATE}" gitHead --json --registry "$registry" > "$package_root/source.json"
          npm pack "${QUESTION_COORDINATE}" --ignore-scripts --json --registry "$registry" \
            --pack-destination "$package_root" > "$package_root/pack.json"
          archive="$(node --input-type=module - "$package_root" <<'JS'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          const root = process.argv[2];
          if (JSON.parse(readFileSync(join(root, "source.json"))) !== process.env.QUESTION_GIT_HEAD)
            throw new Error("Question producer does not identify the original source commit");
          const [pack, ...rest] = JSON.parse(readFileSync(join(root, "pack.json")));
          if (!pack || rest.length || pack.id !== process.env.QUESTION_COORDINATE ||
              !/^[-a-zA-Z0-9._]+\.tgz$/.test(pack.filename))
            throw new Error("Unexpected question producer archive");
          const archive = join(root, pack.filename);
          const integrity = "sha512-" + createHash("sha512").update(readFileSync(archive)).digest("base64");
          if (integrity !== process.env.QUESTION_INTEGRITY) throw new Error("Question producer artifact changed");
          console.log(archive);
          JS
          )"
          tar -xzf "$archive" -C "$package_root"
          printf 'RESEARCH_QUESTION_PRODUCER=%s\n' "$package_root/package/scripts/record-research-question-cli.mjs" >> "$GITHUB_ENV"
      - name: Install original workspace packages
        run: |
          python -m pip install \
            apps/research-program-workbench/research-corpus \
            apps/research-program-workbench/program-planner
      - name: Execute original-producer to planner integration and refusal cases
        run: |
          python -m unittest discover \
            -s apps/research-program-workbench/program-planner/tests \
            -v

  living-science-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the original research workbench
        uses: actions/checkout@v4
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the living-science packages
        run: |
          python -m pip install \
            apps/research-program-workbench/research-corpus \
            apps/research-program-workbench/research-citations \
            apps/research-program-workbench/program-validator \
            apps/research-program-workbench/program-planner \
            apps/research-program-workbench/program-auditor \
            apps/research-program-workbench/research-dagger \
            apps/research-program-workbench/monograph-composer
      - name: Ensure the native citation renderer is available
        shell: bash
        run: |
          if ! command -v pandoc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends pandoc
          fi
          pandoc --version
      - name: Verify the living-science receiving specification
        run: |
          python -m unittest discover -s apps/research-program-workbench/tests -p 'test_*receiving.py' -v
          python -m unittest discover -s apps/research-program-workbench/tests -p test_living_science_contracts.py -v

  authored-vocabulary-receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the existing vocabulary producer
        run: python -m pip install apps/research-program-workbench/research-corpus
      - name: Check authored field, destination and audience receiving
        run: |
          python -m unittest discover -s apps/research-program-workbench/tests -p test_authored_vocabulary_relations.py -v
