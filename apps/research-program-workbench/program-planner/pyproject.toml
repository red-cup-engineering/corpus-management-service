[project]
name = "program-planner"
version = "0.1.0"
description = "Surface research demands from a research-corpus library."
requires-python = ">=3.11"
dependencies = ["research-corpus", "pyyaml>=6"]

[project.scripts]
program-planner = "program_planner.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
