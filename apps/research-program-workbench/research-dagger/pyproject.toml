[project]
name = "research-dagger"
version = "0.1.0"
description = "DAG ordering for research-corpus content: topo sort plus narrative placement by positioning relations."
requires-python = ">=3.11"
dependencies = ["research-corpus"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
