[project]
name = "cite-tool"
version = "0.1.0"
description = "CLI for the research-citations toolkit."
requires-python = ">=3.11"
dependencies = ["research-citations", "pyyaml>=6"]

[project.scripts]
cite-tool = "cite_tool.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
