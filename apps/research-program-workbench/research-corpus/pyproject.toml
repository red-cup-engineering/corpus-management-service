[project]
name = "research-corpus"
version = "0.1.1.dev5"
description = "Library: parse and graph a frontmatter-markdown research library."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
verify-glossary-snapshot = "research_corpus.glossary_snapshot:main"
research-vocabulary = "research_corpus.vocabulary:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
