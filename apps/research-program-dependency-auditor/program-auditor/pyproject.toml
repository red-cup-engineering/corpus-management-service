[project]
name = "program-auditor"
version = "0.1.0"
description = "Dependency-graph audit of a research-corpus library."
requires-python = ">=3.11"
dependencies = ["research-corpus", "pyyaml>=6"]

[project.scripts]
program-auditor = "program_auditor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
